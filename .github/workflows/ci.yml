name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Exécuter les tests unitaires
        run: npm run test

      - name: Construire la production
        run: npm run build

  e2e:
    name: Smoke Chromium
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Exécuter le smoke test Chromium
        run: npm run test:e2e -- --project=chromium

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
