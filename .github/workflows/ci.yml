name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: npm run format:check

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Vérifier l'indépendance du moteur scientifique
        run: npm run typecheck:science

      - name: Exécuter les tests unitaires
        run: npm run test

      - name: Construire la production
        run: npm run build

  e2e:
    name: E2E multi-navigateurs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright et leurs dépendances système
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Exécuter les tests E2E multi-navigateurs
        run: xvfb-run -a npm run test:e2e

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
